
spring.application.name=RoyalBNF-Test

# Use the restored test database, not the original database
spring.datasource.url=jdbc:mysql://localhost:3306/royal_bnf_restore_test
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Never modify the test database schema automatically
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
